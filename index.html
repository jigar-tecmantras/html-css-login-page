<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive HTML and CSS login page">
  <title>Sign in | Welcome back</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">L</div>
      <p class="eyebrow">Welcome back</p>
      <h1 id="login-title">Sign in to your account</h1>
      <p class="intro">Enter your details below to continue.</p>

      <form class="login-form" action="#" method="post">
        <div class="field-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field-group">
          <div class="field-label-row">
            <label for="password">Password</label>
            <a href="#forgot-password" class="text-link">Forgot password?</a>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required>
        </div>

        <label class="remember-option" for="remember-me">
          <input id="remember-me" name="remember-me" type="checkbox">
          <span>Remember me</span>
        </label>

        <button type="submit">Sign in</button>
      </form>

      <p class="signup-prompt">Don’t have an account? <a href="register.html" class="text-link">Create one</a></p>
    </section>
  </main>
</body>
</html>
