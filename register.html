<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive HTML and CSS registration page">
  <title>Create account | Welcome</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="login-card" aria-labelledby="register-title">
      <div class="brand-mark" aria-hidden="true">L</div>
      <p class="eyebrow">Get started</p>
      <h1 id="register-title">Create your account</h1>
      <p class="intro">Enter your details below to create your account.</p>

      <form class="login-form" action="#" method="post">
        <div class="field-group">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full-name" type="text" autocomplete="name" placeholder="Your full name" required>
        </div>

        <div class="field-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field-group">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Enter your phone number" required>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="6" required>
        </div>

        <div class="field-group">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Repeat your password" minlength="6" required>
        </div>

        <label class="remember-option" for="terms">
          <input id="terms" name="terms" type="checkbox" required>
          <span>I agree to the terms and conditions</span>
        </label>

        <button type="submit">Create account</button>
      </form>

      <p class="signup-prompt">Already have an account? <a href="index.html" class="text-link">Sign in</a></p>
    </section>
  </main>
</body>
</html>
